# Maps a test-data "Field" display name to a Locator_ID from dvs_locators.properties.
# Used when the Field text in DVS_Automation_TestData.xlsx is not exactly the locator key.
# Format:  <Module>|<Field text, lower case> = <Locator_ID>      (Module = Individual / Minor / Legal Entity / *)
# Example:
# Individual|aadhaar number = IND_POI_poiNumber
# *|mobile = IND_CON_mobNo
# Rows whose Field is neither a locator key nor listed here are reported as NOT RUN (see Unmapped sheet in the result file).
