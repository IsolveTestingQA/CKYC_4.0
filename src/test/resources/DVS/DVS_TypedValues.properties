# Typed values for positive rows whose Input_Value in the workbook is only a description.
# Format:  <TC_ID> = <Locator_ID> | <value> ; <Locator_ID> | <value> ; ...
#   The LAST pair is the field the row checks (Expected_Result is judged on it); earlier pairs are set first.
#   A blank value after '|' clears the field.  Radios / checkboxes: value is ignored for radio, true/false for checkbox.
# Values are chosen to be accepted by CERSAI (A-Z, digits, space, . ' - / only; PAN = 5 letters + 4 digits + letter,
# 4th letter P for an individual). Customer: IN05100004 only. Not live-verified yet - the first run reports each row.

# Mother only: radio Mother + mother's first name, father / spouse left blank (Father must not be forced)
DVS-POS-IND-0007 = IND_PER_fatherSpouseFlag_MOTHER | x ; IND_PER_motherFirstName | LAKSHMI
# Spouse only
DVS-POS-IND-0008 = IND_PER_fatherSpouseFlag_SPOUSE | x ; IND_PER_spouseFirstName | RAMESH
# First name only, middle / last blank
DVS-POS-IND-0030 = IND_PER_middleName | ; IND_PER_lastName | ; IND_PER_firstName | MURUGAN
# Title Mx (one of the title dropdowns - the others are not located yet)
DVS-POS-IND-0001 = IND_PER_prefix | Mx
# Address with the special characters CERSAI accepts (the workbook value has # & @ % = ~ ` which are not assumed safe)
DVS-POS-IND-0012 = IND_CON_add1 | 12/3 1ST-FLOOR A.B
