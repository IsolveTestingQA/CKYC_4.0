# User Management accounts - update here when the current requirement changes.
# Never mutate seed users/roles.

# Maker used by the User Management features (the rest of the suite keeps using config.properties username).
# Password = maker.password, or password.default when maker.password is blank.
maker.username=automaker
maker.password=

# Independent Checker for create / edit / role approval. Password = password.default
checker.primary=autochecker

# Checker for lock / unlock / dormant on TEST AUTO users (same account as the Checker above). Password = password.default
checker.branch=autochecker

# Same-role negative: an Admin-role user (admin and auto are both Admin) must NOT be able to approve the Maker's request
checker.sameRole=admin

password.default=Welcome@123
# Admin login only; never use this password for autochecker / automaker / auto
password.adminFallback=KMPL@123
