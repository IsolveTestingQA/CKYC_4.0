# User Management accounts — update here when current requirement changes.
# Maker is always config.properties username (auto). Never mutate seed users/roles.

# Independent Checker (different role from Maker). Password = password.default
checker.primary=shyam

# Branch Checker only (lock / unlock / dormant on TEST AUTO users). Password = password.default
checker.branch=Nivijay

# Same-role negative: user with Admin-like role must NOT be able to approve Maker's request
checker.sameRole=admin

password.default=Welcome@123
# Admin login only; never use this password for shyam / Nivijay / auto
password.adminFallback=KMPL@123
